spring.application.name=socialnetwork_fullstackß

# PostgreSQL (pgAdmin) datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/socialnetworkfullstack
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Google Maps (chiave demo)
google.maps.api-key=AIzaSyDWqbxPTSVZN72MG4c857Kn8F7ZzsYhnjQ

# OCR (Tesseract via Tess4J) - percorsi specifici di questa macchina (Homebrew)
ocr.tessdata-path=/opt/homebrew/share/tessdata
ocr.language=ita+eng
ocr.native-library-path=/opt/homebrew/lib
