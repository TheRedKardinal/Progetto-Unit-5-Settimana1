spring.application.name=socialnetwork_fullstackß

# PostgreSQL (pgAdmin) datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/socialnetworkfullstack
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# OCR (binario Tesseract via CLI) - percorsi specifici di questa macchina (Homebrew)
ocr.binary-path=/opt/homebrew/bin/tesseract
ocr.tessdata-path=/opt/homebrew/share/tessdata
ocr.language=ita+eng
